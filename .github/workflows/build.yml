name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run Tests
      run: |
        go test -v ./...
        go test -v ./cmd/goclip/...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: arm
          - goos: freebsd
            goarch: arm
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        LDFLAGS="-s -w"
        if [ "$GOOS" = "linux" ]; then LDFLAGS="$LDFLAGS -extldflags '-static'"; fi

        go build -trimpath -ldflags="$LDFLAGS" -o build/goclip$EXT ./cmd/goclip

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../goclip-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          tar -czvf goclip-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: goclip-${{ matrix.goos }}-${{ matrix.goarch }}
        path: goclip-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  release:
    name: Create Official Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true

  nightly:
    name: Update Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*
